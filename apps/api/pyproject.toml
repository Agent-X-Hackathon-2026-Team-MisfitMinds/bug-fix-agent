[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "bug-fix-agent-api"
version = "0.1.0"
description = "Bug-fix agent API service"
requires-python = ">=3.12"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.109.0"
uvicorn = {"extras": ["standard"], "version": "^0.27.0"}
pydantic = "^2.7.0"
httpx = "^0.25.0"
pydantic-settings = "^2.2.0"

[tool.poetry.dev-dependencies]
pytest = "^7.4.0"
ruff = "^0.1.0"
mypy = "^1.7.0"
pytest-httpx = "^1.0.0"

[tool.poetry.scripts]