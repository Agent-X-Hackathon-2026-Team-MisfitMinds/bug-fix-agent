name: Frontend CI

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      API_BACKEND_URL: ''
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci --workspaces=false
      - name: Lint
        run: npm run lint --workspaces=false
      - name: Type check
        run: npm run check --workspaces=false
      - name: Unit tests
        run: npm test --workspaces=false
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Browser tests
        run: npm run test:e2e --workspaces=false -- --workers=1
      - name: Build
        run: npm run build --workspaces=false
