name: API CI

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: G3 - ruff
        run: python -m ruff check .

      - name: G4 - mypy --strict
        run: python -m mypy --strict .

      - name: G6 - pytest unit
        run: python -m pytest tests/unit -q

  audit:
    name: G13 - dependency audit (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      - name: Audit pinned requirements
        run: >
          python -m pip_audit -r apps/api/requirements.txt --progress-spinner off --desc
          || echo "::warning::pip-audit reported vulnerable pins; see the step log"
