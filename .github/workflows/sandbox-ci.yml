name: Sandbox CI

# The Docker sandbox cannot be covered by mocks: the original failure was
# `git clone` running inside `--network=none`. Run the real container only when
# sandbox inputs change, plus always on main so the integration branch keeps a
# verified baseline.

on:
  pull_request:
    paths:
      - "apps/api/pipeline/sandbox.py"
      - "apps/api/docker/**"
      - "apps/api/tests/integration/test_sandbox_docker.py"
      - "apps/api/tests/integration/test_sandbox_repo.py"
      - "apps/api/requirements.txt"
      - ".github/workflows/sandbox-ci.yml"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sandbox-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-sandbox:
    name: Real container run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Build the sandbox image
        run: docker build -f apps/api/docker/sandbox.Dockerfile -t bug-fix-agent-sandbox:latest apps/api

      - name: Install API dependencies
        run: pip install -r apps/api/requirements.txt

      - name: Run the sandbox against the demo repository
        working-directory: apps/api
        env:
          RUN_DOCKER_TESTS: "1"
        run: pytest tests/integration/test_sandbox_repo.py -q

      - name: Run the isolation probes
        working-directory: apps/api
        env:
          RUN_DOCKER_TESTS: "1"
        run: pytest tests/integration/test_sandbox_docker.py -q
